<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>System Access</title>

<style>
* {
    margin: 0;
    padding: 0;
    font-family: monospace;
}

body {
    background: black;
    color: #00ff9d;
    overflow: hidden;
}

/* BOOT SCREEN */
#boot {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    animation: bootFade 3s forwards;
}

@keyframes bootFade {
    0% { opacity: 1; }
    80% { opacity: 1; }
    100% { opacity: 0; display: none; }
}

/* LOGIN TERMINAL */
#terminal {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

input {
    background: black;
    border: 1px solid #00ff9d;
    color: #00ff9d;
    padding: 10px;
    font-size: 18px;
}

button {
    margin-top: 10px;
    padding: 10px 20px;
    background: #00ff9d;
    border: none;
    color: black;
    cursor: pointer;
}

/* MAIN SYSTEM */
#system {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
    position: relative;
    background: black;
    overflow: hidden;
}

/* animated background glitch image */
#system::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url("mikasa.jpg.jfif") center/cover no-repeat;
    filter: brightness(0.4) contrast(1.2);
    animation: glitchBg 0.2s infinite;
}

@keyframes glitchBg {
    0% { transform: translate(0); }
    50% { transform: translate(2px, -2px); }
    100% { transform: translate(-2px, 2px); }
}

/* TEXT */
#msg {
    position: relative;
    font-size: 60px;
    color: white;
    text-shadow: 0 0 20px #ff00ff;
    opacity: 0;
}

/* unlock animation */
.unlock {
    animation: reveal 2s forwards;
}

@keyframes reveal {
    0% { opacity: 0; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1); }
}

/* screen shake */
.shake {
    animation: shake 0.2s 5;
}

@keyframes shake {
    0% { transform: translate(0); }
    25% { transform: translate(5px, -5px); }
    50% { transform: translate(-5px, 5px); }
    75% { transform: translate(5px, 5px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">Initializing love system...</div>

<!-- TERMINAL -->
<div id="terminal">
    <div>> Enter authorized name:</div>
    <input id="name" type="text">
    <button onclick="check()">ACCESS</button>
</div>

<!-- SYSTEM -->
<div id="system">
    <div id="msg">bishhh, i love u</div>
</div>

<script>
setTimeout(() => {
    document.getElementById("terminal").style.display = "flex";
}, 3000);

function check() {
    let name = document.getElementById("name").value.toLowerCase().trim();

    if (name === "ayesha") {
        document.getElementById("terminal").style.display = "none";
        document.getElementById("system").style.display = "flex";

        let msg = document.getElementById("msg");

        msg.classList.add("unlock");
        document.body.classList.add("shake");

        setTimeout(() => {
            document.body.classList.remove("shake");
        }, 1000);
    }
}
</script>

</body>
</html>
